services:


  # ---------- API GATEWAY ----------
  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - usuarios
      - espacios
      - disponibilidad
      - reservas

  # ---------- FRONTEND----------
  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  # ---------- SERVICIO DE USUARIOS ----------
  usuarios:
    build: ./usuarios
    env_file:
      - .env
    environment:
      DB_HOST: mysql_usuarios
      DB_NAME: usuarios_db
    depends_on:
      mysql_usuarios:
        condition: service_healthy

  # ---------- SERVICIO DE ESPACIOS (hoteles y habitaciones) ----------
  espacios:
    build: ./espacios
    env_file:
      - .env
    environment:
      DB_HOST: mysql_espacios
      DB_NAME: espacios_db
    depends_on:
      mysql_espacios:
        condition: service_healthy
      usuarios:
        condition: service_started

  # ---------- SERVICIO DE RESERVAS ----------
  reservas:
    build: ./reservas
    env_file:
      - .env
    environment:
      DB_HOST: mysql_reservas
      DB_NAME: reservas_db
    depends_on:
      mysql_reservas:
        condition: service_healthy
      usuarios:
        condition: service_started
      espacios:
        condition: service_started
      disponibilidad:
        condition: service_started

  # ---------- SERVICIO DE DISPONIBILIDAD (ocupaciones y fechas libres) ----------
  disponibilidad:
    build: ./disponibilidad
    env_file:
      - .env
    environment:
      DB_HOST: mysql_disponibilidad
      DB_NAME: disponibilidad_db
    depends_on:
      mysql_disponibilidad:
        condition: service_healthy
      espacios:
        condition: service_started

  # ---------- BASES DE DATOS----------
  mysql_usuarios:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: usuarios_db
    ports:
      - "3307:3306"
    volumes:
      - datos_usuarios:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql_espacios:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: espacios_db
    ports:
      - "3308:3306"
    volumes:
      - datos_espacios:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql_reservas:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: reservas_db
    ports:
      - "3309:3306"
    volumes:
      - datos_reservas:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql_disponibilidad:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: disponibilidad_db
    ports:
      - "3310:3306"
    volumes:
      - datos_disponibilidad:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  datos_usuarios:
  datos_espacios:
  datos_reservas:
  datos_disponibilidad:

