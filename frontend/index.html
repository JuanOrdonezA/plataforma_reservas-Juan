<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración · Hoteles Cauca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Inicio de sesión del administrador -->
<div id="vista-login" class="login">
  <form id="form-login" class="tarjeta-login">
    <span class="marca">Hoteles Cauca</span>
    <h1>Panel de administración</h1>
    <label>Correo<input id="l-correo" type="email" autocomplete="username" required></label>
    <label>Contraseña<input id="l-password" type="password" autocomplete="current-password" required></label>
    <p class="error" id="error-login" role="alert" hidden></p>
    <button class="boton" type="submit">Ingresar</button>
    <a class="enlace" href="cliente.html">Ir a la página de clientes</a>
  </form>
</div>

<!-- Panel -->
<div id="vista-panel" class="panel" hidden>
  <aside>
    <span class="marca">Hoteles Cauca</span>
    <small class="rol">Administración</small>
    <nav id="menu">
      <button data-seccion="resumen" class="activo">Resumen</button>
      <button data-seccion="usuarios">Usuarios</button>
      <button data-seccion="hoteles">Hoteles</button>
      <button data-seccion="habitaciones">Habitaciones</button>
      <button data-seccion="ocupaciones">Ocupaciones</button>
      <button data-seccion="reservas">Reservas</button>
    </nav>
    <div class="sesion">
      <span id="admin-nombre"></span>
      <button class="enlace-claro" type="button" id="btn-salir">Cerrar sesión</button>
    </div>
  </aside>

  <main>
    <header class="barra">
      <h1 id="titulo"></h1>
      <div class="barra-acciones">
        <button class="boton secundario" type="button" id="btn-recargar">Actualizar</button>
        <button class="boton" type="button" id="btn-nuevo" hidden></button>
      </div>
    </header>
    <div class="aviso" id="aviso" role="alert" hidden></div>
    <div id="contenido"></div>
  </main>
</div>

<!-- Formulario genérico (crear / editar) -->
<dialog id="dlg-form">
  <button class="cerrar" type="button" id="form-cerrar" aria-label="Cerrar">×</button>
  <form id="form">
    <h2 id="form-titulo"></h2>
    <div class="campos" id="form-campos"></div>
    <p class="error" id="form-error" role="alert" hidden></p>
    <button class="boton ancho-boton" type="submit" id="form-enviar">Guardar</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="admin.js"></script>
</body>
</html>
